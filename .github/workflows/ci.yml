# CI: the test suite, and proof that the image actually serves.
#
# Neither job touches the network beyond pip, Docker Hub and the Playwright
# browser download. Nothing here fetches from the yedion — that is the nightly
# job's business, and only its business.
#
# The two jobs read DIFFERENT catalogs, on purpose:
#
#   test   -> tests/fixtures/catalog  (frozen; nightly data cannot break CI)
#   docker -> data/catalog            (the real one; it is what ships)
#
# See tests/conftest.py for why, and tests/test_catalog_invariants.py for the
# one test that does look at the real catalog.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # The full suite is ~14 min locally, most of it Playwright. 30 leaves
    # room for a slower runner without letting a wedged browser hang the job.
    timeout-minutes: 30

    env:
      # Belt and braces: tests/conftest.py sets this too, but setting it at
      # job level means the seed step below reads the frozen catalog as well,
      # not just pytest.
      SLOTWISE_CATALOG_DIR: tests/fixtures/catalog

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-scraper.txt

      - name: Install the Playwright browser
        # NOT optional, and the reason is a bug this workflow already had.
        # Nine test modules open with `pytest.importorskip("playwright...")`
        # at module level. Without the package that raises at import time, so
        # the whole module is skipped and its tests are never collected — one
        # line of "s" in the output and nothing else. The first two CI runs
        # looked green in 32 seconds while silently not running 36 tests,
        # including the 8 colour-token tests CLAUDE.md calls load-bearing.
        #
        # Installing the browser is what lets the suite run in full, which is
        # why there is no --ignore list below any more: a hand-maintained list
        # of "browser tests" is exactly what drifted out of date.
        run: python -m playwright install --with-deps chromium

      - name: Seed the gitignored fixtures
        # data/db/ and data/profile.json are gitignored — correctly, they are
        # college content and personal data — but part of the suite needs
        # them. On a clean checkout without this: 4 failures and 33 errors,
        # all FileNotFoundError. --fixture builds them from the frozen
        # catalog, so the store the tests run against is frozen too.
        run: python scripts/seed_dev_data.py --fixture

      - name: Guard against silently skipped modules
        # The failure this catches is the one above: a module that skips at
        # import collects zero tests and says almost nothing. A floor on the
        # collected count turns that back into a red job.
        #
        # Raise MIN_TESTS when you add tests; lower it only when you have
        # deliberately deleted some, and say so in the commit.
        run: |
          set -euo pipefail
          MIN_TESTS=961
          collected=$(python -m pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          echo "collected: $collected (floor $MIN_TESTS)"
          if [ "$collected" -lt "$MIN_TESTS" ]; then
            echo "::error::only $collected tests collected, expected at least $MIN_TESTS."
            echo "::error::A test module probably skipped at import. Run pytest -ra to see which."
            exit 1
          fi

      - name: Run the test suite
        # The whole suite. No --ignore: see the Playwright step.
        # -ra prints the reason for every skip, so a skip can never again be
        # invisible in the log.
        run: python -m pytest -q -ra

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the image
        # No registry login and no push: this job proves the Dockerfile
        # builds and the container serves. Publishing is a separate decision.
        run: docker build -t slotwise:ci .

      - name: Start the container
        run: |
          docker run -d --name slotwise-ci -p 8000:8000 slotwise:ci
          echo "started"

      - name: Wait for the container to report healthy
        # The image declares a HEALTHCHECK that polls /api/catalog/meta, so
        # "healthy" already means the catalog loaded — not merely that the
        # port is open. Polling that status is a stronger check than curling
        # the port ourselves, and we do both.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' slotwise-ci 2>/dev/null || echo "unknown")
            echo "attempt $i: $status"
            case "$status" in
              healthy) echo "container is healthy"; exit 0 ;;
              unhealthy) echo "::error::container reported unhealthy"; exit 1 ;;
            esac
            if [ "$(docker inspect --format '{{.State.Running}}' slotwise-ci)" != "true" ]; then
              echo "::error::container stopped while starting up"
              exit 1
            fi
            sleep 2
          done
          echo "::error::container never became healthy within 120s"
          exit 1

      - name: GET /api/catalog/meta must be 200
        # This job deliberately serves the REAL data/catalog, not the frozen
        # fixture: the image is what ships, so what it serves is what matters.
        # The assertions are invariants (non-zero count, a timestamp), never
        # pinned values, so a nightly catalog update cannot turn this red.
        run: |
          set -euo pipefail
          code=$(curl -s -o response.json -w '%{http_code}' http://127.0.0.1:8000/api/catalog/meta)
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::expected HTTP 200, got $code"
            exit 1
          fi
          # A 200 carrying an empty catalog would mean the image built but
          # shipped no data — green CI, dead app. Assert the payload too.
          python - <<'PY'
          import json, sys
          data = json.load(open("response.json", encoding="utf-8"))
          assert data.get("ok") is True, data
          count = data.get("course_count") or 0
          assert count > 0, f"the image serves an empty catalog: {data}"
          assert data.get("built_at"), f"no build timestamp: {data}"
          print(f"OK: {count} courses, built {data['built_at']}")
          PY

      - name: Container logs
        if: always()
        run: docker logs slotwise-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f slotwise-ci || true
