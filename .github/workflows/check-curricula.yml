# Weekly curriculum check.
#
# Compares data/curricula/*.json and data/curriculum.json with the shnaton
# Braude publishes as HTML (w3.braude.ac.il/shnaton-YY-YY/bsc/<slug>/), and
# reports - never edits. A new shnaton applies to the cohort that starts in
# it, so whether a difference is a fix for everyone or a change for new
# students only is a human decision. See scripts/check_curricula.py.
#
# Why this exists: on 2026-11-16 Electrical's "כימיה א'" was still 41090 in
# our file while the shnaton and the yedion had moved to 41089, so the
# interface said the course was not offered. Nothing told us.
#
# Outcomes:
#   exit 0 -> no differences, nothing happens
#   exit 1 -> differences: one open issue is created, or updated in place
#   exit 2 -> a page could not be fetched or parsed (redesign?): the run
#             fails, and GitHub emails the failure
#
# Ten page requests a week. Do not make it run more often than that.

name: weekly curriculum check

on:
  schedule:
    # Sunday 04:17 UTC = 06:17/07:17 in Israel. Off the hour on purpose.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      year:
        description: "Shnaton year as it appears in the URL (26-27 = תשפ\"ז)"
        required: false
        default: "26-27"

concurrency:
  group: curriculum-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Standard library only - nothing to install.
      - name: Compare with the shnaton
        id: check
        run: |
          set +e
          python scripts/check_curricula.py --year "${{ github.event.inputs.year || '26-27' }}" > report.md
          rc=$?
          cat report.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ge 2 ]; then
            echo "::error::a shnaton page could not be fetched or parsed - see the report"
            exit "$rc"
          fi
          exit 0

      - name: Open or update the issue
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "תוכניות הלימודים שונות מהשנתון"
        run: |
          set -euo pipefail
          {
            echo "הבדיקה השבועית מצאה הבדלים בין קבצי התוכניות לבין השנתון באתר בראודה."
            echo "הסקריפט אינו משנה קבצים: יש לבדוק כל שורה ולהחליט אם היא תיקון לכולם או שינוי למחזור החדש בלבד."
            echo
            echo "ריצה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat report.md
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                   --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "::notice::updated issue #$number"
          else
            gh issue create --title "$TITLE" --body-file body.md
            echo "::notice::opened a new issue"
          fi
