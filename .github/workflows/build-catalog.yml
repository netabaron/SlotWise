# Nightly catalog build.
#
# This is HOSTING_NOTES.md §2 made real: the maintainer command with a
# different trigger. It reuses the paced fetch loop, the throttle guard, all
# six validation gates and the atomic write exactly as they are — only the
# trigger ("I run it") and the destination ("git commit") changed.
#
# It replaces per-user scraping, which is the thing that cannot be hosted:
# fifty students each fetching 572 pages is fifty times over a limit already
# measured being hit at ~400 requests/hour.
#
# Read before changing the schedule: a full build is ~86 minutes of paced
# requests against a college server. Do not make this run more than nightly,
# and do not lower --pace.

name: nightly catalog build

on:
  # Both questions that kept this disabled have been answered:
  #
  #   1. Does Braude answer a GitHub datacenter IP? YES. Runs 35262996905 and
  #      35284235638 each fetched 571/571 course pages with zero failures.
  #   2. Would a fresh catalog turn CI red? NO, not since the suite was
  #      decoupled from it: tests read the frozen tests/fixtures/catalog,
  #      and only test_catalog_invariants.py looks at the shipped one — and
  #      it asserts invariants, never pinned values.
  #
  # 23:00 UTC is 02:00 IDT in summer (UTC+3) and 01:00 IST in winter (UTC+2).
  # Israel has no fixed offset and GitHub cron has no DST, so one expression
  # cannot mean 02:00 all year; both land in the quiet hours, which is the
  # property that matters.
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Gregorian academic year (2027 = תשפ\"ז)"
        required: false
        default: "2027"
      pace:
        description: "Seconds between requests. Lower it only if you know why."
        required: false
        default: "9"

# One build at a time, ever. cancel-in-progress is false on purpose: killing a
# run halfway leaves a half-fetched data/raw and wastes an hour of polite
# requests that the college server already served.
concurrency:
  group: nightly-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26 on
    # 2026-10-19. Move the pin deliberately, in its own commit, after a run
    # on the new image has been seen green.
    runs-on: ubuntu-24.04
    # ~86 min of fetching plus parse and validation. 180 leaves room for a
    # slow day without letting a wedged run burn hours.
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The branch as it is when the job STARTS, not github.sha. A run's
          # SHA is fixed when it is triggered, and the concurrency group above
          # queues a second build rather than running it alongside the first
          # — so without this a queued build checks out a commit from before
          # the catalog the first build just pushed. That is what failed run
          # 36207384586: queued at 01:08, started at 01:36 on 4765868, and the
          # rebase onto main (6351af5, pushed by the manual run 36203029195
          # four seconds earlier) conflicted in catalog.meta.json. Starting
          # from the tip means the previous catalog is the one gate 4 compares
          # against and the rebase below only has to carry non-catalog commits.
          ref: ${{ github.ref_name }}
          # Needed so the commit at the end can be pushed back.
          persist-credentials: true
          # Full history, because the commit step rebases onto the new tip of
          # main before pushing. The default shallow clone has no merge base
          # to rebase against, and the rebase fails at the end of a 90-minute
          # build — the one moment it must not.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-scraper.txt installs the Playwright *package* only.
          # `playwright install` is deliberately NOT run: the default fetch
          # path (src/yedion_http.py) is standard library only and needs no
          # browser, and the ~400 MB of browser binaries would be pure waste.
          # requirements-dev.txt is here for pytest alone: the step below runs
          # tests/test_catalog_invariants.py against the freshly built
          # catalog. It pulls in no browser and costs a couple of seconds.
          pip install -r requirements.txt -r requirements-scraper.txt -r requirements-dev.txt

      - name: Resolve build inputs
        id: inputs
        run: |
          echo "year=${{ github.event.inputs.year || '2027' }}" >> "$GITHUB_OUTPUT"
          echo "pace=${{ github.event.inputs.pace || '9' }}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch the course index
        # build_catalog.py reads data/db/catalog.json to learn which course
        # codes exist this year, and data/db is gitignored — so on a clean
        # checkout that index is empty, every coverage ratio divides by zero,
        # and gate 2 fails before a single page is fetched. Verified
        # 2026-09-16. This is ONE request (S_LOOK_FOR_NOSE_AB returns the
        # whole catalog), and it is what lets a new course appear at all:
        # seeding the index from the shipped catalog instead would freeze the
        # course list at whatever it was the day the pipeline was written.
        run: |
          set -o pipefail
          mkdir -p data/db data/raw
          python refresh.py --catalog-only --year "${{ steps.inputs.outputs.year }}" 2>&1 | tee -a build.log

      - name: Build the catalog
        id: build
        run: |
          set -o pipefail
          set +e
          python build_catalog.py \
            --year "${{ steps.inputs.outputs.year }}" \
            --pace "${{ steps.inputs.outputs.pace }}" \
            --out data/catalog 2>&1 | tee -a build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Exit codes are build_catalog.py's contract (see its --help):
          # 0 ok · 1 gate failed · 2 error · 3 throttled · 4 endpoint gated ·
          # 5 the yedion session kept reverting the year after re-opening.
          # In every non-zero case the output files were NOT touched, so the
          # previously committed catalog stays live. That is the design:
          # "the previous catalog beats a new broken one, always."
          case "$rc" in
            0) echo "::notice::catalog built" ;;
            1) echo "::error::a validation gate failed - the committed catalog was left alone" ;;
            3) echo "::error::the yedion throttled us - try again later, do not lower --pace" ;;
            4) echo "::error::the public endpoint is gated (login wall). Automation cannot fix this; see DEPLOY.md" ;;
            5) echo "::error::the yedion session kept reverting to another academic year, even after re-opening it - the run stopped early. Try again later" ;;
            *) echo "::error::build failed with exit code $rc" ;;
          esac
          exit "$rc"

      # Note what is deliberately absent: the test suite. The nightly job
      # runs verify_catalog.py and nothing else, because the suite is pinned
      # to the FROZEN catalog (tests/fixtures/catalog) and would be testing
      # yesterday's data against today's build — it would either pass
      # vacuously or fail for the wrong reason. The artifact is checked by
      # its own gates and by verify_catalog.py; the code is checked by ci.yml.
      - name: Verify the built catalog
        # Separate from the gates on purpose. The gates check the *build*
        # (raw dumps, coverage, non-regression); this checks the *artifact*
        # that is about to be committed, including the one failure no build
        # gate can see: a meta.json that does not match the catalog beside it.
        run: |
          set -o pipefail
          python scripts/verify_catalog.py --dir data/catalog --year "${{ steps.inputs.outputs.year }}" 2>&1 | tee -a build.log

      - name: Check the built catalog against the app's assumptions
        # The last gate before this reaches main, and the only one that asks
        # "would the application accept this?" rather than "is this file
        # internally consistent?". verify_catalog.py already covers the
        # latter; this covers records missing a groups list, a catalog with
        # no timed meeting anywhere, and a meta whose Hebrew year label does
        # not match its Gregorian year.
        #
        # It matters here more than anywhere else because **CI never sees
        # this commit**. A push authenticated with GITHUB_TOKEN does not
        # trigger workflow runs — verified 2026-09-19, zero runs for e11a4af,
        # the first nightly commit to land. Without this step the catalog
        # reaches main with nothing but its own build gates behind it.
        #
        # Exactly one file, deliberately. tests/conftest.py points the whole
        # suite at the FROZEN tests/fixtures/catalog, and
        # test_catalog_invariants.py is the single test that loads the real
        # data/catalog instead — so it is the only one that would be testing
        # what was just built. Running more here would test yesterday's
        # fixture and prove nothing about tonight's catalog.
        run: |
          set -o pipefail
          python -m pytest tests/test_catalog_invariants.py -q -ra 2>&1 | tee -a build.log

      - name: Commit and push if the catalog changed
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/catalog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::catalog unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only ever these two files. data/raw and data/db are gitignored,
          # and .gitignore denies everything else under data/ by default, so
          # a stray artifact cannot ride along unnoticed.
          git add data/catalog/catalog.jsonl data/catalog/catalog.meta.json
          git commit -m "catalog: nightly build ${{ steps.inputs.outputs.date }}"

          # A fresh checkout of this repo is NOT clean, and rebase refuses to
          # run with unstaged changes. .gitattributes declares
          # tests/fixtures/real_yedion/*.html as eol=lf while the stored blobs
          # still contained CRLF, so git rewrote them on checkout and they
          # showed as modified before this job did anything at all. That is
          # what killed run 35284235638 at the final step, after 100 minutes
          # of fetching — and --autostash turned it into a misleading "stash
          # apply conflicted" instead of saying so.
          #
          # The blobs were renormalised on 2026-09-18 so a fresh clone is
          # clean again, but this step no longer depends on that: the two
          # files we care about are committed above, data/raw and data/db are
          # gitignored, and anything else in the tree at this point is
          # disposable.
          git checkout -- .

          # main almost certainly moved while we were fetching. This job runs
          # for ~100 minutes from a checkout of the commit that triggered it,
          # so any push in that window is a non-fast-forward — after an hour
          # and a half of polite requests the college's server already served.
          # Rebase our one commit onto the new tip.
          git fetch origin "${{ github.ref_name }}"
          if ! git rebase "origin/${{ github.ref_name }}"; then
            git rebase --abort || true
            echo "::error::could not rebase the catalog commit onto origin/${{ github.ref_name }}."
            echo "::error::Most likely something else changed data/catalog/ while this build ran."
            echo "::error::The built catalog is in the build log artifact; nothing was pushed."
            exit 1
          fi

          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::catalog updated and pushed"

      - name: Upload the build log
        # always(): the log is most useful precisely when the build failed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ steps.inputs.outputs.date }}-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14
